name: quantdash_user
version: 1.1.2
plugin_api_version: 1
display_name: "QuantDash（个人订阅）"
author: "TSP QuantDash Adapter"
runtime: python
entry: provider:QuantDashProvider
check: provider:availability
api_key_env: QUANTDASH_TOKEN
requires_app: '>=0.3.24'
requires_python: '>=3.11'
platforms: [any]
requires:
  - 'quantdash==0.1.0'
  - 'polars>=1.44,<1.45'
datasets: [daily, minute, realtime, adj_factor, depth5, full_minute]
homepage: 'https://quantdash.net/'
key_manage_url: 'https://quantdash.net/'
key_manage_label: 'QuantDash 服务管理'
description: |
  使用个人 QuantDash 订阅为 TSP 提供原始日K、1分钟K、全市场实时行情、除权因子与五档盘口。
  插件独立安装，不修改 TSP 核心或 MA55；只启用已试拉验证的数据能力。
  全量分钟复用已授权的批量 1m K 线，按当日修复轮落盘；停牌/空数据不伪造。
install_hint: '请先在 TSP 后端 Python 环境安装 quantdash==0.1.0，再在此填写 QuantDash API Key，或设置 QUANTDASH_TOKEN 环境变量。'
usage_notes:
  - '日K/分钟K一律 adjust=none；不在插件重复复权。'
  - '1m 批量读取，每批最多 100 个代码，按不超过 12 日的时间窗口拉取。'
  - '所有 HTTP 请求默认共用 12 次/滚动60秒的进程内预算，可通过 TSP_QUANTDASH_RPM 调整（不是跨进程配额）。'
  - '实时快照是全市场数据源，请把 TSP 轮询间隔设为至少 30 秒再启用。'
  - '复权因子的事件/累积口径及五档数量单位需完成有 Key 的实测后再启用。'
  - '全量分钟采用修复轮，与实时快照共用 12 次/分钟预算；TSP v0.3.29 间隔上限 120 秒，整轮串行执行，全市场一轮约 5 分钟。'
  - '五档使用已授权的单标的接口逐股聚合，每股 1 次 HTTP 请求；不调用个人订阅未授权的 depth/batch，仍共用上述请求预算。'
